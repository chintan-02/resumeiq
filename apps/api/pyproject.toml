[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "resumeiq-api"
version = "0.1.0"
description = "ResumeIQ v2: evidence-grounded requirement matching API"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110,<1",
  "pydantic>=2.6,<3",
  "uvicorn[standard]>=0.29,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "httpx>=0.27,<1", "ruff>=0.6"]
embeddings = ["sentence-transformers>=3,<6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
resumeiq_api = ["tuned_thresholds.json", "samples/walkthrough/*.md", "samples/walkthrough/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]  # line length is handled by `ruff format`
