name: API

on:
  push:
    branches: [main]
    paths: ["apps/api/**", "evals/**", ".github/workflows/api.yml"]
  pull_request:
    branches: [main]
    paths: ["apps/api/**", "evals/**", ".github/workflows/api.yml"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml

      - name: Install
        run: pip install -e "apps/api[dev]"

      - name: Lint
        working-directory: apps/api
        run: |
          ruff check src tests ../../evals/run_baseline.py ../../evals/run_eval_v1.py ../../evals/run_claimcheck.py
          ruff format --check src tests ../../evals/run_baseline.py ../../evals/run_eval_v1.py ../../evals/run_claimcheck.py

      - name: Tests
        working-directory: apps/api
        run: pytest -q

      - name: Baseline report reproduces exactly
        run: python evals/run_baseline.py --check

      - name: Held-out report (matcher v2 on eval_v1) is reproducible
        run: python evals/run_eval_v1.py --check

      - name: Claim-checker report (claimcheck_v0) is reproducible
        run: python evals/run_claimcheck.py --check

      - name: Walkthrough fallback matches live output
        run: |
          python -m resumeiq_api.build_walkthrough
          git diff --exit-code apps/api/src/resumeiq_api/samples/walkthrough/fitmap.json

      - name: Container image builds and serves
        run: |
          docker build -t resumeiq-api apps/api
          docker run -d --name api -p 8080:8080 resumeiq-api
          for i in $(seq 1 20); do curl -fs localhost:8080/health && break; sleep 1; done
          curl -fs localhost:8080/v1/samples/walkthrough/fit-map > /dev/null
          docker logs api 2>&1 | grep -q '"route": "/v1/samples/{sample_id}/fit-map"'
