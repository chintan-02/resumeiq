name: v2 API

on:
  push:
    branches: [v2]
    paths: ["apps/api/**", "evals/**", ".github/workflows/v2-api.yml"]
  pull_request:
    branches: [v2]
    paths: ["apps/api/**", "evals/**", ".github/workflows/v2-api.yml"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml

      - name: Install
        run: pip install -e "apps/api[dev]"

      - name: Lint
        working-directory: apps/api
        run: |
          ruff check src tests ../../evals/run_baseline.py
          ruff format --check src tests ../../evals/run_baseline.py

      - name: Tests
        working-directory: apps/api
        run: pytest -q

      - name: Baseline report reproduces exactly
        run: python evals/run_baseline.py --check

      - name: Walkthrough fallback matches live output
        run: |
          python -m resumeiq_api.build_walkthrough
          git diff --exit-code apps/api/src/resumeiq_api/samples/walkthrough/fitmap.json
